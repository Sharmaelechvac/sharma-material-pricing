<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HVAC Pricing — Sharma Material Pricing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <img class="logo" src="../assets/logo.png" alt="Sharma Electric &amp; HVAC" width="900" height="193">
    <div class="app-name">Material Pricing</div>
  </div>
</header>
<nav class="tabs" aria-label="Trade">
  <a class="tab" href="../electrical/">Electrical</a>
  <a class="tab active" href="../hvac/">HVAC</a>
</nav>
<main class="wrap" id="app" hidden>
  <section class="panel">
    <h2>HVAC prices</h2>
    <p class="note" id="asof"></p>
    <div class="controls">
      <input id="q" type="search" placeholder="Search item" aria-label="Search item">
      <select id="supplier" aria-label="Filter by supplier"><option value="">All suppliers</option></select>
      <label class="chk"><input type="checkbox" id="staleOnly"> Stale only</label>
    </div>
    <div id="items"></div>
  </section>
  <section class="panel">
    <h2>Per-house rollup — HVAC</h2>
    <div id="rollup"></div>
  </section>
  <p class="foot">Prices come only from the office price tracker (supplier tickets and quotes). A price is flagged STALE when its ticket is more than 30 days old — verify before quoting. Sharma Electric &amp; HVAC</p>
</main>
<script>window.PRICE_TRADE = "hvac"; window.PRICE_LABEL = "HVAC";</script>
<script src="../lock.js"></script>
<script src="../app.js"></script>
</body>
</html>
