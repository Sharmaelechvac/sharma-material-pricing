<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HVAC Material Pricing — Sharma Electric &amp; HVAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css?v=5">
</head>
<body class="trade-hvac">
<header class="top">
  <div class="top-in">
    <img class="logo" src="../assets/logo.png" alt="Sharma Electric &amp; HVAC" width="900" height="193">
    <div class="app-name">Material Prices</div>
  </div>
</header>
<div class="band gold"><div class="band-in">HVAC Material Pricing</div></div>
<nav class="switch"><a href="../electrical/">Switch to Electrical</a><a href="../combined/">Combined</a></nav>
<main class="wrap" id="app" hidden>
  <section class="stats" id="stats" aria-label="Key numbers"></section>
  <p class="asof-line" id="asof"></p>
  <section class="panel">
    <h2>Prices — HVAC</h2>
    <div class="controls">
      <div class="ctl-row">
        <input id="q" type="search" placeholder="Search wire, breakers, boxes…" aria-label="Search items">
        <select id="sort" aria-label="Sort items">
          <option value="name">Name</option>
          <option value="price">Price</option>
          <option value="updated">Newest first</option>
          <option value="change">Biggest change</option>
          <option value="oldest">Oldest first</option>
        </select>
      </div>
      <div class="views" id="views" role="group" aria-label="Change how items are shown">
        <span class="views-lab">View</span>
        <button type="button" class="view-btn" data-view="cards">Photos</button>
        <button type="button" class="view-btn" data-view="list">List</button>
        <button type="button" class="view-btn" data-view="sheet">Sheet</button>
        <button type="button" class="view-btn" data-view="supplier">By supplier</button>
      </div>
      <div class="cats" id="cats"></div>
      <div class="chips" id="chips"></div>
    </div>
    <div id="items"></div>
    <div id="sheet" hidden></div>
  </section>
  <section class="panel boxed">
    <h2>Cost per house — HVAC</h2>
    <div id="rollup"></div>
  </section>
  <p class="foot">Every price here is a price we pay a distributor, from the office price tracker. Prices older than 45 days are marked for a re-check — check before you quote. Sharma Electric &amp; HVAC</p>
</main>
<script>window.PRICE_TRADE = "hvac"; window.PRICE_LABEL = "HVAC";</script>
<script src="../lock.js"></script>
