<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Elec + HVAC Material Pricing — Sharma Electric &amp; HVAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <img class="logo" src="../assets/logo.png" alt="Sharma Electric &amp; HVAC" width="900" height="193">
    <div class="app-name">Material Prices</div>
  </div>
</header>
<div class="band dnavy"><div class="band-in">Combined Material Pricing</div></div>
<nav class="switch"><a href="../electrical/">Electrical only</a><a href="../hvac/">HVAC only</a></nav>
<main class="wrap" id="app" hidden>
  <section class="stats c4" id="stats" aria-label="Key numbers"></section>
  <p class="asof-line" id="asof"></p>
  <section class="panel">
    <h2>Prices — Combined</h2>
    <div class="controls">
      <div class="ctl-row">
        <input id="q" type="search" placeholder="Search wire, breakers, boxes…" aria-label="Search items">
        <select id="sort" aria-label="Sort items">
          <option value="name">Name</option>
          <option value="price">Price</option>
          <option value="updated">Newest first</option>
          <option value="change">Biggest change</option>
          <option value="oldest">Oldest first</option>
        </select>
      </div>
      <div class="seg" role="group" aria-label="Filter by trade">
        <button type="button" class="seg-btn active" data-t="all">All</button>
        <button type="button" class="seg-btn" data-t="electrical">Electrical</button>
        <button type="button" class="seg-btn" data-t="hvac">HVAC</button>
      </div>
      <div class="cats" id="cats"></div>
      <div class="chips" id="chips"></div>
    </div>
    <div id="items"></div>
    <div id="sheet" hidden></div>
  </section>
  <section class="panel boxed">
    <h2>Cost per house — Combined</h2>
    <div id="rollup"></div>
  </section>
  <p class="foot">Every price here is a price we pay a distributor, from the office price tracker. Prices older than 45 days are marked for a re-check — check before you quote. Sharma Electric &amp; HVAC</p>
</main>
<script>window.PRICE_TRADE = "combined"; window.PRICE_LABEL = "Combined";</script>
<script src="../lock.js"></script>
<script src="../app.js"></script>
</body>
</html>
